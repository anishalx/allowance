# Render's free tier sleeps after 15 idle minutes; one always-on service fits in its 750 free hours/month.
# Set the repository variable APP_URL (e.g. https://allowance.onrender.com) to enable.
name: keep-awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.APP_URL }}/api/health"
